name: 'Run Revyl Test'
description: 'Run a Revyl test or workflow with real-time monitoring'
author: 'Revyl'

inputs:
  api-key:
    description:
      'Revyl API key for authentication (can also use REVYL_API_KEY env var)'
    required: false
  workflow-id:
    description: 'The workflow ID to run'
    required: false
  workflow_id:
    description: 'DEPRECATED: Use workflow-id instead. The workflow ID to run'
    required: false
    deprecationMessage: 'workflow_id is deprecated. Use workflow-id instead.'
  test-id:
    description: 'The test ID to run'
    required: false
  retries:
    description: 'Number of retry attempts (1-5)'
    required: false
    default: '1'
  build-id:
    description: 'Exact build ID to run (overrides the saved selection)'
    required: false
  build-version-id:
    description:
      'DEPRECATED: Use build-id instead. Exact build ID to run (overrides the
      saved selection)'
    required: false
    deprecationMessage: 'build-version-id is deprecated. Use build-id instead.'
  branch:
    description:
      "Revyl branch to run on. Defaults to the saved selection of the test or
      workflow, which is the app default branch unless changed. Without
      build-id, the run uses the branch's default build: its pinned build, or
      its newest build when it isn't pinned. With build-id, that build must
      belong to this branch or the run fails before it starts."
    required: false
  all-branches:
    description:
      'Run on the newest build across all branches of the app (All branches ·
      Latest build). With workflow-id, each app in the workflow uses its own
      newest build. Cannot be combined with branch or build-id. Requires Revyl
      CLI 0.1.149 or newer.'
    required: false
    default: 'false'
  timeout:
    description: 'Timeout in seconds (default: 3600)'
    required: false
    default: '3600'
  no-wait:
    description: 'Exit after test starts without waiting for completion'
    required: false
    default: 'false'
  backend-url:
    description: 'Override backend base URL'
    required: false
    default: 'https://backend.revyl.ai'
  dashboard-url:
    description: 'Override dashboard base URL for report links'
    required: false
    default: 'https://app.revyl.ai'
  cli-version:
    description: 'Revyl CLI version to use (default: latest)'
    required: false
    default: 'latest'

outputs:
  success:
    description: 'Whether the test/workflow succeeded'
    value: ${{ steps.run-cli.outputs.success }}
  task_id:
    description: 'The task ID for the execution'
    value: ${{ steps.run-cli.outputs.task_id }}
  report_link:
    description: 'Link to the test report'
    value: ${{ steps.run-cli.outputs.report_link }}
  execution_time:
    description: 'Total execution time'
    value: ${{ steps.run-cli.outputs.execution_time }}
  error_message:
    description: 'Error message if failed'
    value: ${{ steps.run-cli.outputs.error_message }}
  platform:
    description: 'Execution platform (ios, android)'
    value: ${{ steps.run-cli.outputs.platform }}
  # Workflow outputs
  total_tests:
    description: 'Total tests in workflow'
    value: ${{ steps.run-cli.outputs.total_tests }}
  completed_tests:
    description: 'Completed tests in workflow'
    value: ${{ steps.run-cli.outputs.completed_tests }}
  passed_tests:
    description: 'Passed tests in workflow'
    value: ${{ steps.run-cli.outputs.passed_tests }}
  failed_tests:
    description: 'Failed tests in workflow'
    value: ${{ steps.run-cli.outputs.failed_tests }}
  # Test outputs
  total_steps:
    description: 'Total steps in test'
    value: ${{ steps.run-cli.outputs.total_steps }}
  completed_steps:
    description: 'Completed steps in test'
    value: ${{ steps.run-cli.outputs.completed_steps }}

runs:
  using: 'composite'
  steps:
    - name: Determine platform
      id: platform
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux)
            echo "os=linux" >> $GITHUB_OUTPUT
            ;;
          macOS)
            echo "os=darwin" >> $GITHUB_OUTPUT
            ;;
          Windows)
            echo "os=windows" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "::error::Unsupported runner.os: ${{ runner.os }}"
            exit 1
            ;;
        esac

        case "${{ runner.arch }}" in
          X64|x64|AMD64|amd64)
            echo "arch=amd64" >> $GITHUB_OUTPUT
            ;;
          ARM64|arm64)
            echo "arch=arm64" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "::error::Unsupported runner.arch: ${{ runner.arch }}"
            exit 1
            ;;
        esac

    - name: Download Revyl CLI
      id: download-cli
      shell: bash
      run: |
        OS="${{ steps.platform.outputs.os }}"
        ARCH="${{ steps.platform.outputs.arch }}"
        VERSION="${{ inputs.cli-version }}"
        DOWNLOAD_DIR="${RUNNER_TEMP}/revyl-cli"
        CLI_PATH="$(bash "${{ github.action_path }}/../scripts/download-cli.sh" \
          --os "$OS" \
          --arch "$ARCH" \
          --version "$VERSION" \
          --output-dir "$DOWNLOAD_DIR")"

        echo "path=${CLI_PATH}" >> "$GITHUB_OUTPUT"

    - name: Run via CLI
      id: run-cli
      shell: bash
      env:
        REVYL_API_KEY: ${{ inputs.api-key || env.REVYL_API_KEY }}
        REVYL_CLI_PATH: ${{ steps.download-cli.outputs.path }}
        BRANCH_INPUT: ${{ inputs.branch }}
        ALL_BRANCHES_INPUT: ${{ inputs.all-branches }}
      run: |
        if [ -z "${REVYL_API_KEY}" ]; then
          echo "::error::Missing REVYL_API_KEY"
          exit 1
        fi

        trim_whitespace() {
          local value="$1"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          printf '%s' "${value}"
        }

        version_is_below() {
          local IFS=.
          local -a found=($1) required=($2)
          local index
          for index in 0 1 2; do
            if (( 10#${found[index]} != 10#${required[index]} )); then
              (( 10#${found[index]} < 10#${required[index]} ))
              return
            fi
          done
          return 1
        }

        fail_before_run() {
          echo "::error::$1"
          echo "success=false" >> $GITHUB_OUTPUT
          echo "error_message=$1" >> $GITHUB_OUTPUT
          exit 1
        }

        require_cli_version() {
          local input_name="$1"
          local min_version="$2"
          local cli_version
          cli_version="$("${REVYL_CLI_PATH}" version 2>&1 | grep -oE '(revyl version|Version:)[[:space:]]+v?[0-9]+\.[0-9]+\.[0-9]+' | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          if [ -n "${cli_version}" ] && version_is_below "${cli_version}" "${min_version}"; then
            fail_before_run "The ${input_name} input needs Revyl CLI ${min_version} or newer (found ${cli_version})."
          fi
        }

        MIN_BRANCH_CLI_VERSION="0.1.148"
        MIN_ALL_BRANCHES_CLI_VERSION="0.1.149"

        BRANCH_INPUT="$(trim_whitespace "${BRANCH_INPUT}")"
        ALL_BRANCHES_INPUT="$(trim_whitespace "${ALL_BRANCHES_INPUT}")"
        case "${ALL_BRANCHES_INPUT}" in
          true | false | '') ;;
          *) fail_before_run "The all-branches input must be true or false." ;;
        esac

        # Support both new (build-id) and deprecated (build-version-id)
        BUILD_ID="${{ inputs.build-id }}"
        BUILD_ID_INPUT_NAME="build-id"
        if [ -z "${BUILD_ID}" ]; then
          BUILD_ID="${{ inputs.build-version-id }}"
          BUILD_ID_INPUT_NAME="build-version-id"
        fi

        if [ "${ALL_BRANCHES_INPUT}" = "true" ]; then
          if [ -n "${BRANCH_INPUT}" ]; then
            fail_before_run "The all-branches input can't be combined with branch. Remove one of them."
          fi
          if [ -n "${BUILD_ID}" ]; then
            fail_before_run "The all-branches input can't be combined with ${BUILD_ID_INPUT_NAME}. Remove one of them."
          fi
          require_cli_version all-branches "${MIN_ALL_BRANCHES_CLI_VERSION}"
        fi
        if [ -n "${BRANCH_INPUT}" ]; then
          require_cli_version branch "${MIN_BRANCH_CLI_VERSION}"
        fi

        WORKFLOW_ID_INPUT="${{ inputs.workflow-id }}"
        WORKFLOW_ID_LEGACY_INPUT="${{ inputs.workflow_id }}"
        RESOLVED_WORKFLOW_ID="${WORKFLOW_ID_INPUT}"
        if [ -z "${RESOLVED_WORKFLOW_ID}" ] && [ -n "${WORKFLOW_ID_LEGACY_INPUT}" ]; then
          RESOLVED_WORKFLOW_ID="${WORKFLOW_ID_LEGACY_INPUT}"
          echo "::warning::workflow_id is deprecated. Use workflow-id instead."
        fi
        if [ -n "${WORKFLOW_ID_INPUT}" ] && [ -n "${WORKFLOW_ID_LEGACY_INPUT}" ] && [ "${WORKFLOW_ID_INPUT}" != "${WORKFLOW_ID_LEGACY_INPUT}" ]; then
          echo "::warning::Both workflow-id and workflow_id were provided with different values. Using workflow-id."
        fi

        # Determine command type
        if [ -n "${{ inputs.test-id }}" ]; then
          RESOURCE="test"
          TARGET_ID="${{ inputs.test-id }}"
          TYPE="test"
        elif [ -n "${RESOLVED_WORKFLOW_ID}" ]; then
          RESOURCE="workflow"
          TARGET_ID="${RESOLVED_WORKFLOW_ID}"
          TYPE="workflow"
        else
          echo "::error::Either test-id or workflow-id (or workflow_id alias) must be provided"
          exit 1
        fi

        # Build arguments
        ARGS=""

        if [ "${{ inputs.retries }}" != "1" ]; then
          ARGS="${ARGS} --retries ${{ inputs.retries }}"
        fi

        if [ "$TYPE" = "test" ] && [ -n "${BUILD_ID}" ]; then
          ARGS="${ARGS} --build-id ${BUILD_ID}"
        fi

        BRANCH_ARGS=()
        if [ -n "${BRANCH_INPUT}" ]; then
          BRANCH_ARGS=("--branch=${BRANCH_INPUT}")
        fi
        if [ "${ALL_BRANCHES_INPUT}" = "true" ]; then
          BRANCH_ARGS+=("--all-branches")
        fi

        if [ "${{ inputs.timeout }}" != "3600" ]; then
          ARGS="${ARGS} --timeout ${{ inputs.timeout }}"
        fi

        if [ "${{ inputs.no-wait }}" = "true" ]; then
          ARGS="${ARGS} --no-wait"
        fi

        # Apply explicit endpoint overrides when provided.
        BACKEND_URL="${{ inputs.backend-url }}"
        DEFAULT_BACKEND_URL="https://backend.revyl.ai"
        if [ -n "${BACKEND_URL}" ] && [ "${BACKEND_URL}" != "${DEFAULT_BACKEND_URL}" ]; then
          export REVYL_BACKEND_URL="${BACKEND_URL}"
          echo "Using backend override: ${BACKEND_URL}"
        fi
        DASHBOARD_URL="${{ inputs.dashboard-url }}"
        DEFAULT_DASHBOARD_URL="https://app.revyl.ai"
        if [ -n "${DASHBOARD_URL}" ] && [ "${DASHBOARD_URL}" != "${DEFAULT_DASHBOARD_URL}" ]; then
          export REVYL_APP_URL="${DASHBOARD_URL}"
        fi

        # Add JSON output for parsing
        ARGS="${ARGS} --json --github-actions --open=false"

        echo "Running: ${REVYL_CLI_PATH} ${RESOURCE} run ${TARGET_ID} ${ARGS} ${BRANCH_ARGS[*]}"

        TMP_OUTPUT="$(mktemp)"
        # Run and capture output
        set +e
        "${REVYL_CLI_PATH}" "${RESOURCE}" run "${TARGET_ID}" ${ARGS} "${BRANCH_ARGS[@]}" 2>&1 | tee "${TMP_OUTPUT}"
        EXIT_CODE=${PIPESTATUS[0]}
        set -e
        OUTPUT="$(cat "${TMP_OUTPUT}")"
        rm -f "${TMP_OUTPUT}"

        json_string_values() {
          sed -E -e 's/^"([^"]*)"[[:space:]]*:[[:space:]]*"/\1=/' -e 's/"$//' -e 's/\\"/"/g' -e 's/\\\\/\\/g'
        }

        extract_string_from() {
          local text="$1"
          local key="$2"
          echo "${text}" | tr -d '\r' | grep -oE "\"${key}\"[[:space:]]*:[[:space:]]*\"([^\"\\\\]|\\\\.)*\"" | head -1 | json_string_values | sed -e 's/^[^=]*=//' || true
        }

        extract_build_pairs_from() {
          local text="$1"
          echo "${text}" | tr -d '\r' | grep -oE '"(branch_name|build_version)"[[:space:]]*:[[:space:]]*"([^"\\]|\\.)*"' | json_string_values | awk '
            {
              separator = index($0, "=")
              key = substr($0, 1, separator - 1)
              value = substr($0, separator + 1)
              if (key == "branch_name") { branch = value; next }
              if (value != "" && branch != "") {
                pair = value " from branch " branch
                if (!(pair in seen)) {
                  seen[pair] = 1
                  pairs = pairs (pairs == "" ? "" : ", ") pair
                }
              }
              branch = ""
            }
            END { print pairs }
          ' || true
        }

        extract_number_from() {
          local text="$1"
          local key="$2"
          echo "${text}" | tr -d '\r' | grep -oE "\"${key}\"[[:space:]]*:[[:space:]]*[0-9]+" | head -1 | sed -E 's/.*:[[:space:]]*([0-9]+)/\1/' || true
        }

        extract_string() {
          extract_string_from "${OUTPUT}" "$1"
        }

        extract_number() {
          extract_number_from "${OUTPUT}" "$1"
        }

        REPORT_LINK=""
        STATUS=""

        # Parse JSON output
        TASK_ID="$(extract_string task_id)"
        if [ -z "${TASK_ID}" ]; then
          TASK_ID="$(extract_string execution_id)"
        fi
        if [ -n "${TASK_ID}" ]; then
          echo "task_id=${TASK_ID}" >> $GITHUB_OUTPUT
          
          # Generate report link
          REPORT_LINK="$(extract_string report_link)"
          if [ -z "${REPORT_LINK}" ] && [ "$TYPE" = "test" ]; then
            REPORT_LINK="${{ inputs.dashboard-url }}/tests/report?taskId=${TASK_ID}"
          elif [ -z "${REPORT_LINK}" ]; then
            REPORT_LINK="${{ inputs.dashboard-url }}/workflows/report?taskId=${TASK_ID}"
          fi
          echo "report_link=${REPORT_LINK}" >> $GITHUB_OUTPUT
        fi

        STATUS="$(extract_string status)"

        # Parse success
        if [ $EXIT_CODE -eq 0 ]; then
          SUCCESS_VALUE="true"
          echo "success=true" >> $GITHUB_OUTPUT
        else
          SUCCESS_VALUE="false"
          echo "success=false" >> $GITHUB_OUTPUT
        fi

        # Parse error message
        ERROR="$(extract_string error)"
        if [ -z "${ERROR}" ]; then
          ERROR="$(extract_string message)"
        fi
        if [ -n "${ERROR}" ]; then
          echo "error_message=${ERROR}" >> $GITHUB_OUTPUT
        fi

        # Parse workflow-specific outputs
        if [ "$TYPE" = "workflow" ]; then
          TOTAL="$(extract_number total_tests)"
          if [ -n "${TOTAL}" ]; then
            echo "total_tests=${TOTAL}" >> $GITHUB_OUTPUT
          fi
          COMPLETED="$(extract_number completed_tests)"
          if [ -n "${COMPLETED}" ]; then
            echo "completed_tests=${COMPLETED}" >> $GITHUB_OUTPUT
          fi
          PASSED="$(extract_number passed_tests)"
          if [ -n "${PASSED}" ]; then
            echo "passed_tests=${PASSED}" >> $GITHUB_OUTPUT
          fi
          FAILED="$(extract_number failed_tests)"
          if [ -n "${FAILED}" ]; then
            echo "failed_tests=${FAILED}" >> $GITHUB_OUTPUT
          fi
          if [ -z "${COMPLETED}" ] && { [ -n "${PASSED}" ] || [ -n "${FAILED}" ]; }; then
            COMPLETED=$(( ${PASSED:-0} + ${FAILED:-0} ))
            echo "completed_tests=${COMPLETED}" >> $GITHUB_OUTPUT
          fi
        fi

        if [ "$TYPE" = "test" ]; then
          TOTAL_STEPS="$(extract_number total_steps)"
          if [ -n "${TOTAL_STEPS}" ]; then
            echo "total_steps=${TOTAL_STEPS}" >> $GITHUB_OUTPUT
          fi
          COMPLETED_STEPS="$(extract_number completed_steps)"
          if [ -n "${COMPLETED_STEPS}" ]; then
            echo "completed_steps=${COMPLETED_STEPS}" >> $GITHUB_OUTPUT
          fi
        fi

        PLATFORM="$(extract_string platform)"
        if [ -n "${PLATFORM}" ]; then
          echo "platform=${PLATFORM}" >> $GITHUB_OUTPUT
        fi

        # Parse duration
        DURATION="$(extract_string duration)"
        if [ -n "${DURATION}" ]; then
          echo "execution_time=${DURATION}" >> $GITHUB_OUTPUT
        fi

        BUILD_LABEL=""
        BUILD_VALUE=""
        if [ "$TYPE" = "test" ]; then
          BUILD_VERSION="$(extract_string build_version)"
          BUILD_BRANCH="$(extract_string branch_name)"
          if [ -n "${BUILD_VERSION}" ] && [ -n "${BUILD_BRANCH}" ]; then
            BUILD_LABEL="Build"
            BUILD_VALUE="${BUILD_VERSION} from branch ${BUILD_BRANCH}"
          fi
        else
          BUILD_VALUE="$(extract_build_pairs_from "$(echo "${OUTPUT}" | sed -n '/"tests"/,/^[[:space:]]*\]/p')")"
          if [ -n "${BUILD_VALUE}" ]; then
            BUILD_LABEL="Builds"
          fi
        fi

        REQUESTED_NO_WAIT="${{ inputs.no-wait }}"
        if [ -z "${STATUS}" ]; then
          if [ "${REQUESTED_NO_WAIT}" = "true" ] && [ "${SUCCESS_VALUE}" = "true" ]; then
            STATUS="queued"
          elif [ "${SUCCESS_VALUE}" = "true" ]; then
            STATUS="completed"
          else
            STATUS="failed"
          fi
        fi

        if [ "$TYPE" = "workflow" ]; then
          echo "Workflow status: ${STATUS}"
          if [ -n "${TOTAL}" ]; then
            echo "Workflow tests: ${COMPLETED:-0}/${TOTAL} completed, ${PASSED:-0} passed, ${FAILED:-0} failed"
          fi
          echo "Workflow success: ${SUCCESS_VALUE}"
        else
          echo "Test status: ${STATUS}"
          if [ -n "${TOTAL_STEPS}" ]; then
            echo "Test steps: ${COMPLETED_STEPS:-0}/${TOTAL_STEPS} completed"
          fi
          echo "Test success: ${SUCCESS_VALUE}"
        fi
        if [ -n "${BUILD_LABEL}" ]; then
          echo "${BUILD_LABEL}: ${BUILD_VALUE}"
        fi

        if [ -n "${REPORT_LINK}" ]; then
          echo "Report: ${REPORT_LINK}"
        fi

        # ── Job Summary ──────────────────────────────────────────────
        TEST_NAME="$(extract_string test_name)"
        WORKFLOW_NAME="$(extract_string workflow_name)"

        escape_summary_text() {
          printf '%s' "$1" | sed \
            -e 's/&/\&amp;/g' -e 's/#/\&#35;/g' \
            -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
            -e 's/|/\&#124;/g' -e 's/\\/\&#92;/g' -e 's/`/\&#96;/g' \
            -e 's/\*/\&#42;/g' -e 's/_/\&#95;/g' \
            -e 's/\[/\&#91;/g' -e 's/\]/\&#93;/g' \
            -e 's/~/\&#126;/g'
        }

        {
          if [ "$TYPE" = "workflow" ]; then
            echo "## Revyl Workflow$(escape_summary_text "${WORKFLOW_NAME:+: ${WORKFLOW_NAME}}")"
            echo ""
            echo "**Status:** <code>$(escape_summary_text "${STATUS}")</code>${DURATION:+ | **Duration:** $(escape_summary_text "${DURATION}")}"
            echo ""
            if [ -n "${ERROR}" ]; then
              echo "**Error:** $(escape_summary_text "${ERROR}")"
              echo ""
            fi
            if [ -n "${BUILD_LABEL}" ]; then
              echo "**${BUILD_LABEL}:** $(escape_summary_text "${BUILD_VALUE}")"
              echo ""
            fi
            if [ -n "${TOTAL}" ]; then
              echo "### Test Results: ${PASSED:-0}/${TOTAL} passed"
              echo ""
            fi

            TEST_JSON_BLOCK="$(echo "${OUTPUT}" | sed -n '/"tests"/,/^[[:space:]]*\]/p')"
            if echo "${TEST_JSON_BLOCK}" | grep -q '"test_name"'; then
              echo "| Test | Platform | Result | Duration |"
              echo "|------|----------|--------|----------|"
              echo "${TEST_JSON_BLOCK}" | grep -o '"test_name"[[:space:]]*:[[:space:]]*"[^"]*"' | sed -E 's/.*"([^"]*)"/\1/' > /tmp/revyl_names.txt
              echo "${TEST_JSON_BLOCK}" | grep -o '"platform"[[:space:]]*:[[:space:]]*"[^"]*"' | sed -E 's/.*"([^"]*)"/\1/' > /tmp/revyl_platforms.txt
              echo "${TEST_JSON_BLOCK}" | grep '"success"' | grep -oE '(true|false)' > /tmp/revyl_success.txt
              echo "${TEST_JSON_BLOCK}" | grep -o '"duration"[[:space:]]*:[[:space:]]*"[^"]*"' | sed -E 's/.*"([^"]*)"/\1/' > /tmp/revyl_durations.txt

              TEST_COUNT=$(wc -l < /tmp/revyl_names.txt | tr -d ' ')
              if [ "${TEST_COUNT}" -gt 0 ]; then
                paste -d$'\t' /tmp/revyl_names.txt /tmp/revyl_platforms.txt /tmp/revyl_success.txt /tmp/revyl_durations.txt | while IFS=$'\t' read -r t_name t_plat t_succ t_dur; do
                  if [ "${t_succ}" = "true" ]; then
                    result_cell="Passed"
                  else
                    result_cell="Failed"
                  fi
                  echo "| $(escape_summary_text "${t_name}") | $(escape_summary_text "${t_plat}") | ${result_cell} | $(escape_summary_text "${t_dur:-—}") |"
                done
              fi
              rm -f /tmp/revyl_names.txt /tmp/revyl_platforms.txt /tmp/revyl_success.txt /tmp/revyl_durations.txt
              echo ""
            fi
          else
            echo "## Revyl Test$(escape_summary_text "${TEST_NAME:+: ${TEST_NAME}}")"
            echo ""
            echo "**Status:** <code>$(escape_summary_text "${STATUS}")</code>${DURATION:+ | **Duration:** $(escape_summary_text "${DURATION}")}"
            if [ -n "${ERROR}" ]; then
              echo ""
              echo "**Error:** $(escape_summary_text "${ERROR}")"
            fi
            if [ -n "${TOTAL_STEPS}" ]; then
              echo ""
              echo "**Steps:** ${COMPLETED_STEPS:-0}/${TOTAL_STEPS} completed"
            fi
            if [ -n "${BUILD_LABEL}" ]; then
              echo ""
              echo "**${BUILD_LABEL}:** $(escape_summary_text "${BUILD_VALUE}")"
            fi
            echo ""
          fi

          if [ -n "${REPORT_LINK}" ]; then
            echo "[View Full Report](${REPORT_LINK})"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"

        exit $EXIT_CODE

branding:
  icon: 'play-circle'
  color: 'purple'
