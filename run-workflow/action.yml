name: 'Run Revyl Workflow'
description: 'Run a Revyl workflow by workflow id with real-time monitoring'
author: 'Revyl'

inputs:
  workflow-id:
    description: 'The workflow id to run.'
    required: false
  workflow_id:
    description:
      'Deprecated alias for workflow-id. Prefer workflow-id in all new workflows.'
    required: false
  retries:
    description: 'Number of retries for failed tests within the workflow.'
    required: false
    default: '1'
  timeout:
    description: 'Timeout in seconds for the workflow execution. Default 3600.'
    required: false
    default: '3600'
  backend-url:
    description:
      'Override backend base URL (e.g., https://backend-staging.revyl.ai)'
    required: false
  no-wait:
    description:
      'If true, launch the workflow and exit immediately after it starts without
      waiting for completion. The action succeeds as long as the execution was
      successfully queued.'
    required: false
    default: 'false'
  cli-version:
    description: 'Revyl CLI version to use (default: latest).'
    required: false
    default: 'latest'

outputs:
  success:
    description: 'Whether the workflow succeeded.'
    value: ${{ steps.run.outputs.success }}
  status:
    description: 'Final workflow status when available.'
    value: ${{ steps.run.outputs.status }}
  task_id:
    description: 'The task identifier returned by the async API.'
    value: ${{ steps.run.outputs.task_id }}
  total_tests:
    description: 'Total number of tests in the workflow.'
    value: ${{ steps.run.outputs.total_tests }}
  completed_tests:
    description: 'Number of tests completed in the workflow.'
    value: ${{ steps.run.outputs.completed_tests }}
  passed_tests:
    description: 'Number of tests that passed in the workflow.'
    value: ${{ steps.run.outputs.passed_tests }}
  failed_tests:
    description: 'Number of tests that failed in the workflow.'
    value: ${{ steps.run.outputs.failed_tests }}
  error_message:
    description: 'Error message if execution failed.'
    value: ${{ steps.run.outputs.error_message }}
  report_link:
    description: 'Shareable link to the workflow/test report when available.'
    value: ${{ steps.run.outputs.report_link }}
  execution_time:
    description: 'Total execution time.'
    value: ${{ steps.run.outputs.execution_time }}

runs:
  using: composite
  steps:
    - name: Determine platform
      id: platform
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux)
            echo "os=linux" >> $GITHUB_OUTPUT
            ;;
          macOS)
            echo "os=darwin" >> $GITHUB_OUTPUT
            ;;
          Windows)
            echo "os=windows" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "::error::Unsupported runner.os: ${{ runner.os }}"
            exit 1
            ;;
        esac

        case "${{ runner.arch }}" in
          X64|x64|AMD64|amd64)
            echo "arch=amd64" >> $GITHUB_OUTPUT
            ;;
          ARM64|arm64)
            echo "arch=arm64" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "::error::Unsupported runner.arch: ${{ runner.arch }}"
            exit 1
            ;;
        esac

    - name: Download Revyl CLI
      id: download-cli
      shell: bash
      run: |
        OS="${{ steps.platform.outputs.os }}"
        ARCH="${{ steps.platform.outputs.arch }}"
        VERSION="${{ inputs.cli-version }}"
        DOWNLOAD_DIR="${RUNNER_TEMP}/revyl-cli"
        CLI_PATH="$(bash "${{ github.action_path }}/../scripts/download-cli.sh" \
          --os "$OS" \
          --arch "$ARCH" \
          --version "$VERSION" \
          --output-dir "$DOWNLOAD_DIR")"

        echo "path=${CLI_PATH}" >> "$GITHUB_OUTPUT"

    - name: Execute workflow via CLI
      id: run
      shell: bash
      env:
        REVYL_API_KEY: ${{ env.REVYL_API_KEY }}
        REVYL_CLI_PATH: ${{ steps.download-cli.outputs.path }}
      run: |
        if [ -z "${REVYL_API_KEY}" ]; then
          echo "::error::Missing REVYL_API_KEY"
          exit 1
        fi

        PRIMARY_WORKFLOW_ID="${{ inputs.workflow-id }}"
        LEGACY_WORKFLOW_ID="${{ inputs.workflow_id }}"
        WORKFLOW_ID="${PRIMARY_WORKFLOW_ID}"

        if [ -z "${WORKFLOW_ID}" ] && [ -n "${LEGACY_WORKFLOW_ID}" ]; then
          WORKFLOW_ID="${LEGACY_WORKFLOW_ID}"
          echo "::warning::Using deprecated input 'workflow_id'. Please use 'workflow-id' instead."
        fi

        if [ -n "${PRIMARY_WORKFLOW_ID}" ] && [ -n "${LEGACY_WORKFLOW_ID}" ] && [ "${PRIMARY_WORKFLOW_ID}" != "${LEGACY_WORKFLOW_ID}" ]; then
          echo "::warning::Both 'workflow-id' and deprecated 'workflow_id' were provided with different values. Using 'workflow-id'."
        fi

        if [ -z "${WORKFLOW_ID}" ]; then
          echo "::error::Missing workflow input. Provide 'workflow-id' (preferred) or 'workflow_id' (legacy alias)."
          exit 1
        fi

        ARGS=""
        REQUESTED_NO_WAIT="${{ inputs.no-wait }}"

        if [ "${{ inputs.retries }}" != "1" ]; then
          ARGS="${ARGS} --retries ${{ inputs.retries }}"
        fi

        if [ "${{ inputs.timeout }}" != "3600" ]; then
          ARGS="${ARGS} --timeout ${{ inputs.timeout }}"
        fi

        if [ "${REQUESTED_NO_WAIT}" = "true" ]; then
          ARGS="${ARGS} --no-wait"
        fi

        BACKEND_URL="${{ inputs.backend-url }}"
        DEFAULT_BACKEND_URL="https://backend.revyl.ai"
        if [ -n "${BACKEND_URL}" ] && [ "${BACKEND_URL}" != "${DEFAULT_BACKEND_URL}" ]; then
          export REVYL_BACKEND_URL="${BACKEND_URL}"
          echo "Using backend override: ${BACKEND_URL}"
        fi

        export TERM=dumb
        export NO_COLOR=1

        ARGS="${ARGS} --json --github-actions --open=false"

        echo "Running: ${REVYL_CLI_PATH} workflow run ${WORKFLOW_ID} ${ARGS}"

        TMP_OUTPUT="$(mktemp)"
        set +e
        "${REVYL_CLI_PATH}" workflow run "${WORKFLOW_ID}" ${ARGS} 2>&1 | tee "${TMP_OUTPUT}"
        EXIT_CODE=${PIPESTATUS[0]}
        set -e
        OUTPUT="$(cat "${TMP_OUTPUT}")"
        rm -f "${TMP_OUTPUT}"

        sanitize_output() {
          local text="$1"
          printf '%s' "${text}" | tr -d '\r' | sed -E 's/\x1B\[[0-9;?]*[[:alpha:]]//g'
        }

        OUTPUT="$(sanitize_output "${OUTPUT}")"

        extract_string_from() {
          local text="$1"
          local key="$2"
          echo "${text}" | grep -o "\"${key}\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" | head -1 | sed -E 's/.*:[[:space:]]*"([^"]*)"/\1/' || true
        }

        extract_number_from() {
          local text="$1"
          local key="$2"
          echo "${text}" | grep -oE "\"${key}\"[[:space:]]*:[[:space:]]*[0-9]+" | head -1 | sed -E 's/.*:[[:space:]]*([0-9]+)/\1/' || true
        }

        extract_string() {
          extract_string_from "${OUTPUT}" "$1"
        }

        extract_number() {
          extract_number_from "${OUTPUT}" "$1"
        }

        extract_report_line_from() {
          local text="$1"
          echo "${text}" | grep -oE '[Rr]eport:[[:space:]]*https?://[^[:space:]]+' | head -1 | sed -E 's/^[Rr]eport:[[:space:]]*//' || true
        }

        extract_task_id_from_link() {
          local link="$1"
          echo "${link}" | sed -nE 's/.*[?&]taskId=([^&[:space:]]+).*/\1/p' | head -1 || true
        }

        REPORT_LINK=""
        STATUS=""
        TOTAL=""
        COMPLETED=""
        PASSED=""
        FAILED=""
        DURATION=""
        ERROR=""

        TASK_ID="$(extract_string task_id)"
        if [ -z "${TASK_ID}" ]; then
          TASK_ID="$(extract_string execution_id)"
        fi

        REPORT_LINK="$(extract_string report_link)"
        if [ -z "${REPORT_LINK}" ]; then
          REPORT_LINK="$(extract_string report_url)"
        fi
        if [ -z "${REPORT_LINK}" ]; then
          REPORT_LINK="$(extract_report_line_from "${OUTPUT}")"
        fi
        if [ -z "${TASK_ID}" ] && [ -n "${REPORT_LINK}" ]; then
          TASK_ID="$(extract_task_id_from_link "${REPORT_LINK}")"
        fi

        DASHBOARD_URL="${REVYL_APP_URL:-https://app.revyl.ai}"
        if [ -z "${REPORT_LINK}" ] && [ -n "${TASK_ID}" ]; then
          REPORT_LINK="${DASHBOARD_URL}/workflows/report?taskId=${TASK_ID}"
        fi

        STATUS="$(extract_string status)"

        if [ $EXIT_CODE -eq 0 ]; then
          SUCCESS_VALUE="true"
          echo "success=true" >> $GITHUB_OUTPUT
        else
          SUCCESS_VALUE="false"
          echo "success=false" >> $GITHUB_OUTPUT
        fi

        ERROR="$(extract_string error)"
        if [ -z "${ERROR}" ]; then
          ERROR="$(extract_string message)"
        fi
        if [ -z "${ERROR}" ]; then
          ERROR="$(extract_string detail)"
        fi
        if [ -n "${ERROR}" ]; then
          echo "error_message=${ERROR}" >> $GITHUB_OUTPUT
        fi

        if [ -n "${TASK_ID}" ]; then
          echo "task_id=${TASK_ID}" >> $GITHUB_OUTPUT
        fi
        if [ -n "${REPORT_LINK}" ]; then
          echo "report_link=${REPORT_LINK}" >> $GITHUB_OUTPUT
        fi

        TOTAL="$(extract_number total_tests)"
        if [ -n "${TOTAL}" ]; then
          echo "total_tests=${TOTAL}" >> $GITHUB_OUTPUT
        fi

        COMPLETED="$(extract_number completed_tests)"
        if [ -n "${COMPLETED}" ]; then
          echo "completed_tests=${COMPLETED}" >> $GITHUB_OUTPUT
        fi

        PASSED="$(extract_number passed_tests)"
        if [ -n "${PASSED}" ]; then
          echo "passed_tests=${PASSED}" >> $GITHUB_OUTPUT
        fi

        FAILED="$(extract_number failed_tests)"
        if [ -n "${FAILED}" ]; then
          echo "failed_tests=${FAILED}" >> $GITHUB_OUTPUT
        fi

        if [ -z "${COMPLETED}" ] && { [ -n "${PASSED}" ] || [ -n "${FAILED}" ]; }; then
          COMPLETED=$(( ${PASSED:-0} + ${FAILED:-0} ))
          echo "completed_tests=${COMPLETED}" >> $GITHUB_OUTPUT
        fi

        DURATION="$(extract_string duration)"
        if [ -n "${DURATION}" ]; then
          echo "execution_time=${DURATION}" >> $GITHUB_OUTPUT
        fi

        if [ -z "${STATUS}" ]; then
          if [ "${REQUESTED_NO_WAIT}" = "true" ] && [ "${SUCCESS_VALUE}" = "true" ]; then
            STATUS="queued"
          elif [ "${SUCCESS_VALUE}" = "true" ]; then
            STATUS="completed"
          else
            STATUS="failed"
          fi
        fi

        echo "status=${STATUS}" >> $GITHUB_OUTPUT
        echo "Workflow status: ${STATUS}"
        if [ -n "${TOTAL}" ]; then
          echo "Workflow tests: ${COMPLETED:-0}/${TOTAL} completed, ${PASSED:-0} passed, ${FAILED:-0} failed"
        fi
        echo "Workflow success: ${SUCCESS_VALUE}"
        if [ -n "${REPORT_LINK}" ]; then
          echo "Report: ${REPORT_LINK}"
        fi

        # ── Job Summary ──────────────────────────────────────────────
        WORKFLOW_NAME="$(extract_string_from "${OUTPUT}" "workflow_name")"

        {
          echo "## Revyl Workflow${WORKFLOW_NAME:+: ${WORKFLOW_NAME}}"
          echo ""
          echo "**Status:** \`${STATUS}\`${DURATION:+ | **Duration:** ${DURATION}}"
          echo ""

          if [ -n "${TOTAL}" ]; then
            echo "### Test Results: ${PASSED:-0}/${TOTAL} passed"
            echo ""
          fi

          # Parse per-test results from the CLI JSON output if available.
          # The CLI emits a "tests" array with objects containing test_name, status, platform, duration, success.
          TEST_JSON_BLOCK="$(echo "${OUTPUT}" | sed -n '/"tests"/,/^[[:space:]]*\]/p')"
          if [ -n "${TEST_JSON_BLOCK}" ]; then
            echo "| Test | Platform | Result | Duration |"
            echo "|------|----------|--------|----------|"
            echo "${TEST_JSON_BLOCK}" | grep -o '"test_name"[[:space:]]*:[[:space:]]*"[^"]*"' | sed -E 's/.*"([^"]*)"/\1/' > /tmp/revyl_names.txt
            echo "${TEST_JSON_BLOCK}" | grep -o '"platform"[[:space:]]*:[[:space:]]*"[^"]*"' | sed -E 's/.*"([^"]*)"/\1/' > /tmp/revyl_platforms.txt
            echo "${TEST_JSON_BLOCK}" | grep '"success"' | grep -oE '(true|false)' > /tmp/revyl_success.txt
            echo "${TEST_JSON_BLOCK}" | grep -o '"duration"[[:space:]]*:[[:space:]]*"[^"]*"' | sed -E 's/.*"([^"]*)"/\1/' > /tmp/revyl_durations.txt

            TEST_COUNT=$(wc -l < /tmp/revyl_names.txt | tr -d ' ')
            if [ "${TEST_COUNT}" -gt 0 ]; then
              paste -d$'\t' /tmp/revyl_names.txt /tmp/revyl_platforms.txt /tmp/revyl_success.txt /tmp/revyl_durations.txt | while IFS=$'\t' read -r t_name t_plat t_succ t_dur; do
                if [ "${t_succ}" = "true" ]; then
                  result_cell="Passed"
                else
                  result_cell="Failed"
                fi
                echo "| ${t_name} | ${t_plat} | ${result_cell} | ${t_dur:-—} |"
              done
            fi
            rm -f /tmp/revyl_names.txt /tmp/revyl_platforms.txt /tmp/revyl_success.txt /tmp/revyl_durations.txt
            echo ""
          fi

          if [ -n "${REPORT_LINK}" ]; then
            echo "[View Full Report](${REPORT_LINK})"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"

        exit $EXIT_CODE
