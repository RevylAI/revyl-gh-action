name: 'Upload Build to Revyl'
description: 'Upload a build artifact or Expo URL to Revyl'
author: 'Revyl'

# Define your inputs here.
inputs:
  app-id:
    description: 'The app ID to upload the build to.'
    required: false
  build-var-id:
    description:
      'DEPRECATED: Use app-id instead. The app ID to upload the build to.'
    required: false
    deprecationMessage: 'build-var-id is deprecated. Use app-id instead.'
  version:
    description:
      'Version/build name for this upload (must be unique within the app).'
    required: true
  file-path:
    description:
      'Path to the build artifact file (for binary uploads). Mutually exclusive
      with expo-url.'
    required: false
  expo-url:
    description:
      'Expo build URL to download and upload. Mutually exclusive with file-path.'
    required: false
  expo-headers:
    description:
      'JSON string of headers to use when downloading from Expo URL (e.g.,
      {"Authorization": "Bearer token"}).'
    required: false
  metadata:
    description:
      'JSON string of additional build metadata. GitHub Actions CI metadata is
      injected automatically and user-provided keys take precedence.'
    required: false
  package-name:
    description:
      'Package name/identifier for the build (will be auto-extracted if not
      provided).'
    required: false
  timeout:
    description:
      'Timeout in seconds for the upload operation. Default 1800 (30 minutes).'
    required: false
    default: '1800'

# Define your outputs here.
outputs:
  success:
    description: 'Whether the upload was successful.'
  build-id:
    description: 'The ID of the created build.'
  version-id:
    description:
      'DEPRECATED: Use build-id instead. The ID of the created build.'
  version:
    description: 'The version string of the uploaded build.'
  package-id:
    description: 'The extracted package ID from the build artifact.'
  upload-time:
    description: 'Time taken for the upload operation in seconds.'
  error-message:
    description: 'Error message if upload failed.'

runs:
  using: node20
  main: dist/index.js
